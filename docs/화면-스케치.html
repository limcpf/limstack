<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>limstack 화면 스케치</title>
</head>
<body>
<div id="limstack-wireframes" lang="ko">
  <style>
    #limstack-wireframes {
      --paper: #fbf9f2;
      --ink: #292822;
      --quiet: #625f53;
      --rule: #d6d0c1;
      --link: #275a4e;
      --mono: ui-monospace, "Liberation Mono", monospace;
      --sans: system-ui, sans-serif;
      --serif: "Noto Serif CJK KR", "Noto Serif KR", "Batang", serif;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
    }
    #limstack-wireframes figure,
    #limstack-wireframes p,
    #limstack-wireframes h2,
    #limstack-wireframes h3,
    #limstack-wireframes ul {
      margin: 0;
    }
    #limstack-wireframes .wire-label {
      display: flex;
      gap: .5rem 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: .5rem;
    }
    #limstack-wireframes .wire-label code {
      overflow-wrap: anywhere;
      font: .8rem var(--mono);
    }
    #limstack-wireframes .wire-page {
      padding: clamp(.875rem, 3vw, 1.75rem);
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    #limstack-wireframes .wire-brand,
    #limstack-wireframes time,
    #limstack-wireframes .wire-path,
    #limstack-wireframes .wire-stack,
    #limstack-wireframes .wire-diagram {
      font-family: var(--mono);
    }
    #limstack-wireframes .wire-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding-bottom: .65rem;
      border-bottom: 1px solid var(--rule);
    }
    #limstack-wireframes .wire-brand { font-size: 1rem; }
    #limstack-wireframes .wire-header span:last-child {
      color: var(--quiet);
      font: .8rem var(--mono);
    }
    #limstack-wireframes .wire-home { font-family: var(--sans); }
    #limstack-wireframes .wire-intro {
      margin: 1.2rem 0 1.6rem;
      color: var(--quiet);
      line-height: 1.6;
    }
    #limstack-wireframes .wire-home h2 {
      font: 600 .9rem var(--sans);
      margin: 1.5rem 0 .45rem;
    }
    #limstack-wireframes .wire-list {
      list-style: none;
      padding: 0;
      font-size: .9rem;
    }
    #limstack-wireframes .wire-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .25rem .75rem;
      flex-wrap: wrap;
      padding: .5rem 0;
      border-top: 1px solid var(--rule);
    }
    #limstack-wireframes .wire-list time,
    #limstack-wireframes .wire-meta {
      font-size: .75rem;
      color: var(--quiet);
    }
    #limstack-wireframes a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: .15em;
    }
    #limstack-wireframes .wire-home .wire-list li:first-child a { font-weight: 600; }
    #limstack-wireframes .wire-path {
      margin: .9rem 0 .65rem;
      color: var(--quiet);
      font-size: .76rem;
    }
    #limstack-wireframes .wire-doc {
      font-family: var(--serif);
      line-height: 1.7;
    }
    #limstack-wireframes .wire-doc h2 {
      font: 600 clamp(1.38rem, 2.7vw, 2rem)/1.3 var(--serif);
      word-break: keep-all;
    }
    #limstack-wireframes .wire-doc h3 {
      font-size: 1.1rem;
      margin: .9rem 0 .2rem;
    }
    #limstack-wireframes .wire-toc {
      border-block: 1px solid var(--rule);
      padding: .45rem 0;
      margin: 1rem 0;
      font-size: .9rem;
    }
    #limstack-wireframes .wire-toc ul {
      padding-left: 1.4rem;
      margin-top: .25rem;
    }
    #limstack-wireframes .wire-diagram {
      padding: .4rem .6rem;
      margin: .7rem 0 0;
      border: 1px solid var(--rule);
      text-align: center;
      font-size: .78rem;
      overflow-wrap: anywhere;
    }
    #limstack-wireframes .wire-caption {
      display: block;
      text-align: center;
      color: var(--quiet);
      font-size: .76rem;
    }
    #limstack-wireframes .wire-back {
      display: inline-block;
      margin-top: 1rem;
      font-size: .82rem;
    }
    @media (max-width: 700px) {
      #limstack-wireframes { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
  <figure>
    <figcaption class="wire-label"><span>홈</span><code>/</code></figcaption>
    <section class="wire-page wire-home" aria-label="홈 화면 스케치">
      <header class="wire-header"><strong class="wire-brand">limstack</strong><span>/stack/</span></header>
      <p class="wire-intro">공부한 기술을 주제별로 쌓아 둔 기록.</p>
      <h2>Stack</h2>
      <ul class="wire-list wire-stack">
        <li><span>architecture</span><span class="wire-meta">1편</span></li>
        <li><span>java</span><span class="wire-meta">2편</span></li>
        <li><span>spring</span><span class="wire-meta">1편</span></li>
      </ul>
      <h2>최근 글</h2>
      <ul class="wire-list">
        <li><a href="#limstack-wire-doc">Servlet 요청 처리 흐름</a><time datetime="2026-11-22">2026-11-22</time></li>
        <li><span>Spring 트랜잭션의 경계</span><time datetime="2026-11-20">2026-11-20</time></li>
        <li><span>의존성 방향을 정하는 기준</span><time datetime="2026-11-18">2026-11-18</time></li>
      </ul>
    </section>
  </figure>
  <figure id="limstack-wire-doc">
    <figcaption class="wire-label"><span>문서 상세</span><code>/stack/java/servlet-request-flow/</code></figcaption>
    <article class="wire-page wire-doc" aria-label="문서 상세 화면 스케치">
      <header class="wire-header"><strong class="wire-brand">limstack</strong><span>/stack/</span></header>
      <p class="wire-path">/ stack / java</p>
      <h2>Servlet 요청 처리 흐름</h2>
      <time class="wire-meta" datetime="2026-11-22">2026-11-22</time>
      <details class="wire-toc">
        <summary>목차</summary>
        <ul>
          <li><a href="#limstack-wire-request">요청이 들어오는 경로</a></li>
          <li><a href="#limstack-wire-filter">필터에서 할 수 있는 일</a></li>
        </ul>
      </details>
      <h3 id="limstack-wire-request">요청이 들어오는 경로</h3>
      <p>서블릿 컨테이너는 HTTP 요청을 받아 필터 체인을 거쳐 대상 서블릿으로 전달한다.</p>
      <figure>
        <div class="wire-diagram">HTTP 요청 → Filter → Servlet</div>
        <figcaption class="wire-caption">그림 1. 서블릿까지의 요청 흐름</figcaption>
      </figure>
      <h3 id="limstack-wire-filter">필터에서 할 수 있는 일</h3>
      <p>필터는 요청과 응답을 살피거나, 조건에 따라 요청을 일찍 끝낼 수 있다.</p>
      <span class="wire-back">← java 글 목록</span>
    </article>
  </figure>
</div>
</body>
</html>
