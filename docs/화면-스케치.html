<div id="limstack-wireframes" lang="ko">
  <style>
    #limstack-wireframes {
      --paper: #fbf9f2;
      --ink: #292822;
      --quiet: #625f53;
      --rule: #d6d0c1;
      --link: #275a4e;
      --prose: "Limstack Sketch Gothic", "Sarasa Gothic K", "Noto Sans CJK KR", system-ui, sans-serif;
      --mono: "Limstack Sketch Mono", "Sarasa Mono K", ui-monospace, "Liberation Mono", monospace;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      align-items: start;
      font-family: var(--prose);
    }
    #limstack-wireframes figure,
    #limstack-wireframes p,
    #limstack-wireframes h2,
    #limstack-wireframes h3,
    #limstack-wireframes ul {
      margin: 0;
    }
    #limstack-wireframes .wire-label {
      display: flex;
      gap: .5rem 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: .5rem;
    }
    #limstack-wireframes .wire-label code {
      overflow-wrap: anywhere;
      font: .8rem var(--mono);
    }
    #limstack-wireframes .wire-page {
      padding: clamp(.875rem, 3vw, 1.75rem);
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    #limstack-wireframes code,
    #limstack-wireframes .wire-brand,
    #limstack-wireframes time,
    #limstack-wireframes .wire-path,
    #limstack-wireframes .wire-diagram {
      font-family: var(--mono);
    }
    #limstack-wireframes .wire-doc code { overflow-wrap: anywhere; }
    #limstack-wireframes .wire-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding-bottom: .65rem;
      border-bottom: 1px solid var(--rule);
    }
    #limstack-wireframes .wire-brand { font-size: 1rem; }
    #limstack-wireframes .wire-header span:last-child {
      color: var(--quiet);
      font: .8rem var(--mono);
    }
    #limstack-wireframes .wire-intro {
      margin: 1.2rem 0 1.6rem;
      color: var(--quiet);
      line-height: 1.6;
    }
    #limstack-wireframes .wire-home h2 {
      font-size: .9rem;
      margin: 1.5rem 0 .45rem;
    }
    #limstack-wireframes .wire-list {
      list-style: none;
      padding: 0;
      font-size: .9rem;
    }
    #limstack-wireframes .wire-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .25rem .75rem;
      flex-wrap: wrap;
      padding: .5rem 0;
      border-top: 1px solid var(--rule);
    }
    #limstack-wireframes .wire-list time,
    #limstack-wireframes .wire-meta {
      font-size: .75rem;
      color: var(--quiet);
    }
    #limstack-wireframes a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: .15em;
    }
    #limstack-wireframes .wire-home .wire-list li:first-child a { font-weight: 700; }
    #limstack-wireframes .wire-path {
      margin: .9rem 0 .65rem;
      color: var(--quiet);
      font-size: .76rem;
    }
    #limstack-wireframes .wire-doc { line-height: 1.7; }
    #limstack-wireframes .wire-doc h2 {
      font-size: clamp(1.38rem, 2.7vw, 2rem);
      line-height: 1.3;
      word-break: keep-all;
    }
    #limstack-wireframes .wire-doc h3 {
      font-size: 1.1rem;
      margin: .9rem 0 .2rem;
    }
    #limstack-wireframes .wire-toc {
      border-block: 1px solid var(--rule);
      padding: .45rem 0;
      margin: 1rem 0;
      font-size: .9rem;
    }
    #limstack-wireframes .wire-toc ul {
      padding-left: 1.4rem;
      margin-top: .25rem;
    }
    #limstack-wireframes .wire-diagram {
      padding: .4rem .6rem;
      margin: .7rem 0 0;
      border: 1px solid var(--rule);
      text-align: center;
      font-size: .78rem;
      overflow-wrap: anywhere;
    }
    #limstack-wireframes .wire-caption {
      display: block;
      text-align: center;
      color: var(--quiet);
      font-size: .76rem;
    }
    #limstack-wireframes .wire-back {
      display: inline-block;
      margin-top: 1rem;
      font-size: .82rem;
    }
    @media (max-width: 700px) {
      #limstack-wireframes { grid-template-columns: minmax(0, 1fr); }
    }
  </style>

      <h3 id="limstack-wire-request">요청이 들어오는 경로</h3>
      <p>Spring MVC에서 <code>DispatcherServlet</code>은 HTTP 요청을 처리할 핸들러를 찾는다.</p>
